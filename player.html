<!doctype html>
<html lang="en" data-type="service">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Put a song on · SongLearn</title>
    <meta
      name="description"
      content="Paste YouTube songs and playlists, stack them in a queue and watch them play on the old TV on the hill."
    />
    <meta name="theme-color" content="#0b1033" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Put a song on · SongLearn" />
    <meta property="og:description" content="Stack up YouTube songs and watch them play on the old TV on the hill." />
    <meta property="og:image" content="share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/player/main.js"></script>
  </head>
  <body class="player-page">
    <a class="skip-link" href="#song-link">Skip to the song box</a>

    <header class="site-header">
      <a class="brand" href="./" aria-label="SongLearn, back to the main page">Song<span>Learn</span></a>

      <!-- In the header bar on wide screens; hanging under it on narrow ones. -->
      <div class="pickers" data-pickers>
        <fieldset class="themes" data-themes>
          <legend class="visually-hidden">Time of day</legend>
          <label class="theme">
            <input type="radio" name="theme" value="dusk" checked />
            <span class="theme-dot" style="--a: #2f4ae8; --b: #f0ae9c" aria-hidden="true"></span>
            <span>Dusk</span>
          </label>
          <label class="theme">
            <input type="radio" name="theme" value="night" />
            <span class="theme-dot" style="--a: #081040; --b: #3b4a8c" aria-hidden="true"></span>
            <span>Night</span>
          </label>
          <label class="theme">
            <input type="radio" name="theme" value="sunset" />
            <span class="theme-dot" style="--a: #d0607a; --b: #ffd07a" aria-hidden="true"></span>
            <span>Sunset</span>
          </label>
          <label class="theme">
            <input type="radio" name="theme" value="dawn" />
            <span class="theme-dot" style="--a: #86aff0; --b: #ffe2cc" aria-hidden="true"></span>
            <span>Dawn</span>
          </label>
        </fieldset>

        <fieldset class="themes" data-seasons>
          <legend class="visually-hidden">Season</legend>
          <label class="theme">
            <input type="radio" name="season" value="spring" />
            <span class="theme-dot" style="--a: #7aa83a; --b: #ffb6cf" aria-hidden="true"></span>
            <span>Spring</span>
          </label>
          <label class="theme">
            <input type="radio" name="season" value="summer" checked />
            <span class="theme-dot" style="--a: #24320f; --b: #a98f3c" aria-hidden="true"></span>
            <span>Summer</span>
          </label>
          <label class="theme">
            <input type="radio" name="season" value="autumn" />
            <span class="theme-dot" style="--a: #a63a18; --b: #e0702a" aria-hidden="true"></span>
            <span>Autumn</span>
          </label>
          <label class="theme">
            <input type="radio" name="season" value="winter" />
            <span class="theme-dot" style="--a: #c4cedb; --b: #ffffff" aria-hidden="true"></span>
            <span>Winter</span>
          </label>
          <label class="theme">
            <input type="radio" name="season" value="rain" />
            <span class="theme-dot" style="--a: #3f4a5e; --b: #a2b6da" aria-hidden="true"></span>
            <span>Rain</span>
          </label>
        </fieldset>
      </div>

      <div class="sound" data-sound>
        <button
          class="sound-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="sound-panel"
          data-on="false"
          title="Ambient sound"
          data-sound-toggle
        >
          <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="m16 9.5 5 5m0-5-5 5" /></svg>
          <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11" /></svg>
          <span class="visually-hidden">Ambient sound</span>
        </button>

        <div class="sound-panel" id="sound-panel" hidden data-sound-panel>
          <div class="sound-row">
            <p class="sound-title" id="sound-title">Ambient sound</p>
            <button class="sound-switch" type="button" aria-pressed="false" aria-labelledby="sound-title" data-sound-switch>
              <span class="sound-switch-knob" aria-hidden="true"></span>
            </button>
          </div>
          <div class="sound-row">
            <label class="sound-label" for="sound-volume">Volume</label>
            <output class="sound-value" for="sound-volume" data-sound-value>70%</output>
          </div>
          <input class="sound-volume" id="sound-volume" type="range" min="0" max="100" step="1" value="70" data-sound-volume />
          <p class="sound-note">Wind, rain, crickets and birds for the sky and season you picked. It goes quieter while a song plays.</p>
        </div>
      </div>
      <a class="header-cta header-back" href="./"><span>Back<span class="back-long"> to the site</span></span></a>
    </header>

    <main id="main" class="stage" data-stage data-hero data-enter data-theme="dusk">
      <h1 class="visually-hidden">Put a song on the TV</h1>
      <div class="hero-sky" aria-hidden="true"></div>
      <canvas class="hero-canvas" aria-hidden="true" data-scene></canvas>
      <div class="stage-shade" aria-hidden="true"></div>
      <div class="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      <!-- Moved onto the TV's screen by the scene (CSS3D); the YouTube player replaces #yt-player. -->
      <div class="tv-video" data-tv-video>
        <div class="tv-video-inner"><div id="yt-player"></div></div>
      </div>

      <section class="deck enter" aria-labelledby="deck-title">
        <h2 id="deck-title" class="visually-hidden">Song queue and controls</h2>
        <p class="visually-hidden" aria-live="polite" data-announce></p>
        <p class="deck-now" data-now aria-live="polite">Nothing on yet. Paste a YouTube link to put a song on.</p>

        <form class="deck-add" data-add novalidate>
          <label class="deck-label" for="song-link">YouTube link: a song, a video or a whole playlist</label>
          <div class="deck-row">
            <input
              id="song-link"
              name="link"
              type="url"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="https://www.youtube.com/watch?v=…"
              aria-describedby="song-link-error"
            />
            <button class="cta deck-add-btn" type="submit">
              <span>Add to queue</span>
              <span class="cta-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></span>
            </button>
          </div>
          <p class="field-error" id="song-link-error" hidden></p>
        </form>

        <div class="deck-controls">
          <div class="transport">
            <button class="icon-btn" type="button" data-prev aria-label="Previous song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM19 5.5v13L9.5 12 19 5.5Z" /></svg>
            </button>
            <button class="icon-btn icon-btn-main" type="button" data-toggle aria-label="Play">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5L8 5.5Z" /></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5h3v14h-3zM13.5 5h3v14h-3z" /></svg>
            </button>
            <button class="icon-btn" type="button" data-next aria-label="Next song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM5 5.5v13l9.5-6.5L5 5.5Z" /></svg>
